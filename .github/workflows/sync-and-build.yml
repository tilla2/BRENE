name: Sync upstream and build release

on:
  workflow_dispatch:
    inputs:
      sync:
        description: 'Fetch and merge upstream BRENE first (uncheck to build this branch as-is)'
        type: boolean
        default: true
      publish:
        description: 'Publish a release right now (leave unchecked to only sync upstream)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-and-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify susfs binary hash
        run: |
          PINNED_SUSFS_SHA256="cb16825fb8c949775c1bf692263d9f59a52f12127fdcacc531b6a612e258a831"
          sha256sum module/tools/susfs* 2>/dev/null | tee /tmp/susfs.sha256 || exit 1
          [ -s module/tools/susfs ] || exit 1
          ACTUAL_SUSFS_SHA256="$(sha256sum module/tools/susfs | awk '{print $1}')"
          if [ "${ACTUAL_SUSFS_SHA256}" != "${PINNED_SUSFS_SHA256}" ]; then
            echo "::error::susfs hash mismatch: expected ${PINNED_SUSFS_SHA256}, got ${ACTUAL_SUSFS_SHA256}" >&2; exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record current HEAD
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add upstream and fetch
        if: inputs.sync == true
        run: |
          git remote add upstream https://github.com/rrr333nnn333/BRENE.git || git remote set-url upstream https://github.com/rrr333nnn333/BRENE.git
          git fetch upstream main

      - name: Try merging upstream
        if: inputs.sync == true
        id: merge
        run: |
          PROTECTED_FILES=("README.md" "CHANGELOG.md" "update.json" "BUILD_NUMBER" "module/module.prop" "module/webroot/index.html" "module/webroot/script.js")
          REAL_CONFLICT_FILES=("module/post-fs-data.sh" "module/config.sh" "module/utils.sh")

          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            REAL_CONFLICT=false
            for f in $CONFLICTED; do
              FOUND=false
              for p in "${PROTECTED_FILES[@]}"; do
                if [[ "$f" == "$p" || "$f" == "$p"/* ]]; then
                  FOUND=true
                  break
                fi
              done
              if [ "$FOUND" = false ]; then
                REAL_CONFLICT=true
              fi
            done
            for f in $CONFLICTED; do
              for r in "${REAL_CONFLICT_FILES[@]}"; do
                if [[ "$f" == "$r" ]]; then
                  REAL_CONFLICT=true
                fi
              done
            done

            if [ "$REAL_CONFLICT" = true ]; then
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              git merge --abort
            else
              for f in $CONFLICTED; do
                git checkout --ours -- "$f"
                git add "$f"
              done
              git commit --no-edit
              echo "conflict=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const TITLE_PREFIX = "Upstream sync conflict";
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open"});
            if (open.data.some(i => i.title.startsWith(TITLE_PREFIX))) { console.log("Open conflict issue already exists, skipping."); return; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream sync conflict - ${new Date().toISOString().slice(0,10)}`,
              body: "Automatic merge from upstream BRENE failed. Resolve manually:\n\`\`\`\ngit fetch upstream main\ngit merge upstream/main\n# resolve conflicts\ngit add .\ngit commit\ngit push\n\`\`\`"
            })

      - name: Check for new upstream commits
        if: inputs.sync == true && steps.merge.outputs.conflict == 'false'
        id: diff
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          COUNT=$(git rev-list --count ${{ steps.pre.outputs.sha }}..$NEW_SHA)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Re-apply customizations onto module/
        if: inputs.sync == true && steps.merge.outputs.conflict == 'false' && steps.diff.outputs.count != '0'
        run: |
          for f in module/post-fs-data.sh module/boot-completed.sh; do
            if ! grep -q 'config_sync_device_props' "$f" || ! grep -q 'config_spoof_system_properties=1' "$f"; then
              echo "::error::OR-migration shim missing in $f" >&2; exit 1
            fi
          done

          if ! grep -q '^config_spoof_system_properties=1' module/config.sh; then
            echo "::error::config_spoof_system_properties missing in module/config.sh" >&2; exit 1
          fi

          if ! grep -q "spoof_system_properties" module/webroot/script.js; then
            echo "::error::spoof_system_properties wiring missing in module/webroot/script.js" >&2; exit 1
          fi

      - name: Brand module
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        run: |
          sed -i "s/^name=.*/name=.BRENE - Custom AI/" module/module.prop
          sed -i "s/^author=.*/author=rrr333nnn333, simonpunk \& KOWX712 + Community/" module/module.prop
          if grep -q "^updateJson=" module/module.prop; then
            sed -i "s#^updateJson=.*#updateJson=https://raw.githubusercontent.com/${{ github.repository }}/main/update.json#" module/module.prop
          else
            echo "updateJson=https://raw.githubusercontent.com/${{ github.repository }}/main/update.json" >> module/module.prop
          fi

      - name: Neutralize redundant upstream fingerprint spoofing
        if: inputs.sync == true && steps.merge.outputs.conflict == 'false' && steps.diff.outputs.count != '0'
        run: |
          python3 << 'PYEOF'
          path = "module/utils.sh"
          with open(path) as f:
              content = f.read()

          old_fingerprint = (
              "\tfingerprint_value=$(resetprop ro.build.fingerprint)\n"
              "\tnew_fingerprint_value=\"${fingerprint_value//userdebug/user}\"\n"
              "\tresetprop_n \"ro.bootimage.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.odm.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.odm_dlkm.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.product.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.system.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.system_dlkm.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.system_ext.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.vendor.build.fingerprint\" \"${new_fingerprint_value}\"\n"
              "\tresetprop_n \"ro.vendor_dlkm.build.fingerprint\" \"${new_fingerprint_value}\"\n"
          )
          new_block_fingerprint = "\t# (fingerprint sync handled by BRENE Custom AI's config_spoof_system_properties feature)\n"

          old_utc = (
              "\tnew_utc_value=$(resetprop ro.build.date.utc)\n"
              "\tresetprop_n \"ro.bootimage.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.odm.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.odm_dlkm.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.product.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.system.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.system_dlkm.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.system_ext.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.vendor.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"ro.vendor_dlkm.build.date.utc\" \"${new_utc_value}\"\n"
              "\tresetprop_n \"persist.vendor.build.date.utc\" \"${new_utc_value}\"\n"
          )
          new_block_utc = ""

          removed_any = False
          if old_fingerprint in content:
              content = content.replace(old_fingerprint, new_block_fingerprint, 1)
              print("Removed redundant upstream fingerprint block from utils.sh")
              removed_any = True
          else:
              print("note: fingerprint block not found (already clean or upstream changed it) -- nothing to do")

          if old_utc in content:
              content = content.replace(old_utc, new_block_utc, 1)
              print("Removed redundant upstream UTC date block from utils.sh (already covered by config_spoof_system_properties)")
              removed_any = True
          else:
              print("note: UTC block not found (already clean or upstream changed it) -- nothing to do")

          if removed_any:
              with open(path, "w") as f:
                  f.write(content)

          PYEOF

      - name: Capture local-vs-upstream change summary
        if: inputs.sync == true && steps.merge.outputs.conflict != 'true' && inputs.publish == true
        run: |
          rm -rf /tmp/upstream_pure
          mkdir -p /tmp/upstream_pure
          git archive upstream/main -- module | tar -x -C /tmp/upstream_pure
          diff -rq /tmp/upstream_pure/module module > /tmp/custom_files.txt 2>&1 || true
          sed -e 's|/tmp/upstream_pure/||g' -e 's|^|- |' /tmp/custom_files.txt > /tmp/local_summary.md || true
          [ -s /tmp/local_summary.md ] || echo "- No local changes against upstream this build." > /tmp/local_summary.md
          cat /tmp/local_summary.md

      - name: Build changelog and release
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        id: build
        run: |
          DATE=$(date -u +%Y-%m-%d)

          if git rev-parse -q --verify upstream/main >/dev/null 2>&1; then
            UPSTREAM_VER=$(git show upstream/main:module/module.prop | grep '^version=' | grep -oE 'v[0-9.]+' | head -1)
          else
            UPSTREAM_VER=$(grep '^version=' module/module.prop | grep -oE 'v[0-9.]+' | head -1)
          fi
          [ -z "$UPSTREAM_VER" ] && UPSTREAM_VER="v0.0.0"

          LAST_VER=$(cat LAST_UPSTREAM_VERSION 2>/dev/null || echo "")
          PREV_NUM=$(cat BUILD_NUMBER 2>/dev/null || echo 0)
          PREV_NUM=$(printf '%s' "$PREV_NUM" | grep -oE '[0-9]+' | head -1)
          [ -z "$PREV_NUM" ] && PREV_NUM=0
          RUN_NUM=$((PREV_NUM + 1))
          echo "$RUN_NUM" > BUILD_NUMBER
          echo "$UPSTREAM_VER" > LAST_UPSTREAM_VERSION

          PREV_CUSTOM_N=$(grep '^version=' module/module.prop | grep -oE 'custom\.[0-9]+' | grep -oE '[0-9]+' | head -1)
          [ -z "$PREV_CUSTOM_N" ] && PREV_CUSTOM_N=0
          if [ "$UPSTREAM_VER" != "$LAST_VER" ]; then
            CUSTOM_N=1
          else
            CUSTOM_N=$((PREV_CUSTOM_N + 1))
            [ "$CUSTOM_N" -lt 1 ] && CUSTOM_N=1
          fi

          BUILD_VERSION="${UPSTREAM_VER}-custom.${CUSTOM_N}"

          PREV_TAG=$(git describe --tags --abbrev=0 --match="v*" 2>/dev/null || echo "")
          {
            echo "## ${BUILD_VERSION} - ${DATE}"
            echo ""
            echo "### Module changes since previous release"
            if [ -n "$PREV_TAG" ]; then
              LOCAL_LOG=$(git log --no-merges --pretty=format:"- %s" "${PREV_TAG}..HEAD" -- module .github | grep -vE '^- (release|chore): ' || true)
              [ -n "$LOCAL_LOG" ] && echo "$LOCAL_LOG" || echo "- No module changes since ${PREV_TAG}."
            else
              echo "- Previous release tag not found; $(git rev-list --count HEAD) commits on ${GITHUB_REF_NAME}."
            fi
            echo ""
            echo "### Upstream BRENE"
            if git rev-parse -q --verify upstream/main >/dev/null 2>&1; then
              UP_LOG=$(git log --pretty=format:"- %s" "${{ steps.pre.outputs.sha }}..${{ steps.diff.outputs.new_sha }}" -- module 2>/dev/null | head -20 || true)
              [ -n "$UP_LOG" ] && echo "$UP_LOG" || echo "- Already up to date with upstream ${UPSTREAM_VER}."
            else
              echo "- Manual rebuild; upstream not fetched this run."
            fi
            echo ""
            echo "### Local customizations"
            if [ -f /tmp/local_summary.md ]; then
              cat /tmp/local_summary.md
            else
              echo "- Not compared this run (built from branch as-is)."
            fi
            echo ""
            echo "### Module"
            echo "- Version: ${BUILD_VERSION} (versionCode ${RUN_NUM})"
            grep '^description=' module/module.prop | sed 's/^description=/- /'
            echo "- Source: https://github.com/${{ github.repository }}/tree/${GITHUB_REF_NAME}"
          } > /tmp/new_entry.md

          cat /tmp/new_entry.md CHANGELOG.md > /tmp/full_changelog.md
          mv /tmp/full_changelog.md CHANGELOG.md

          sed -i "s/^version=.*/version=${BUILD_VERSION}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${RUN_NUM}/" module/module.prop

          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "run_num=${RUN_NUM}" >> "$GITHUB_OUTPUT"

      - name: Update update.json
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        run: |
          cat > update.json << EOF
          {
            "version": "${{ steps.build.outputs.build_version }}",
            "versionCode": ${{ steps.build.outputs.run_num }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.build.outputs.build_version }}/BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          EOF

      - name: Commit and push
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        run: |
          git add module update.json CHANGELOG.md BUILD_NUMBER LAST_UPSTREAM_VERSION
          git commit -m "release: ${{ steps.build.outputs.build_version }}"
          git push origin HEAD

      - name: Commit and push (sync only, no release)
        if: inputs.sync == true && steps.merge.outputs.conflict == 'false' && steps.diff.outputs.count != '0' && inputs.publish == false
        run: |
          git add module
          if git diff --cached --quiet; then
            echo "No local customization changes to commit."
          else
            git commit -m "chore: sync upstream changes (no release published)"
          fi
          git push origin HEAD

      - name: Publish update.json and CHANGELOG.md to main
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ steps.build.outputs.build_version }}
        run: |
          python3 << 'PYEOF'
          import base64, json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GH_TOKEN"]
          ver = os.environ["BUILD_VERSION"]
          hdr = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json", "User-Agent": "sync-and-build"}
          def api(url, data=None, method="GET"):
              req = urllib.request.Request(url, data=data, headers=hdr, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  print("::warning::%s %s -> %s" % (method, url, e))
                  return None
          for path in ("update.json", "CHANGELOG.md"):
              content = open(path, "rb").read()
              cur = api("https://api.github.com/repos/%s/contents/%s?ref=main" % (repo, path))
              body = {"message": "release: %s for %s" % (path, ver), "branch": "main",
                      "content": base64.b64encode(content).decode()}
              if isinstance(cur, dict) and cur.get("sha"):
                  try:
                      if base64.b64decode(cur.get("content") or b"") == content:
                          print("%s on main is already current" % path)
                          continue
                  except Exception:
                      pass
                  body["sha"] = cur["sha"]
              res = api("https://api.github.com/repos/%s/contents/%s" % (repo, path), data=json.dumps(body).encode(), method="PUT")
              print("pushed %s to main: %s" % (path, "ok" if res else "failed (see warning above)"))
          PYEOF

      - name: Zip module (only module/ contents at zip root)
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        run: |
          cd module
          zip -X -r9 "../BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip" . -x ".git*" "*.pyc" "__pycache__/*" ".DS_Store*"
          unzip -l "../BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip"
          zip -T "../BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip"
          cd ..

      - name: Check tag absence
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        run: |
          if git rev-parse "${{ steps.build.outputs.build_version }}" >/dev/null 2>&1; then
            echo "::warning::tag ${{ steps.build.outputs.build_version }} already exists"
            exit 1
          else
            echo "Tag ${{ steps.build.outputs.build_version }} not present, proceeding."
          fi

      - name: Create Release
        if: steps.merge.outputs.conflict != 'true' && inputs.publish == true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: "${{ steps.build.outputs.build_version }}"
          name: "BRENE Custom AI ${{ steps.build.outputs.build_version }}"
          body_path: /tmp/new_entry.md
          files: "BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip"
